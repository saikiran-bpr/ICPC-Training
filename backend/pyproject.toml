[project]
name = "icpc-training-backend"
version = "0.1.0"
description = "FastAPI backend for the ICPC Training Problem Repository (Supabase Postgres)."
requires-python = ">=3.11"
dependencies = [
  # HTTP layer
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",          # form parsing (file uploads / future use)
  "itsdangerous>=2.2",                # session cookie signing
  "httpx>=0.27",                      # runtime: app/services/lookup.py (URL metadata fetch)

  # Validation + settings
  "pydantic>=2.7",
  "pydantic-settings>=2.4",

  # Database
  "psycopg[binary]>=3.1",
  "psycopg-pool>=3.2",

  # Misc
  "werkzeug>=3.0",                    # PBKDF2 password hashing helpers
  "openpyxl>=3.1",                    # XLSX export
  "python-dotenv>=1.0",               # load .env in dev
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",                      # async test client
  "ruff>=0.5",
  "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ---------------------------------------------------------------------------
# tool configs
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]   # long lines OK in SQL/Pydantic schemas

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["legacy/", "scripts/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
